name: bckr

services:
  change-ownership:
    image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: chown -R 1000:1000 /hugo_cache
    volumes:
      - hugo_cache:/hugo_cache
  hugo:
    image: hugomods/hugo:go-git-0.163.1@sha256:d8f57e4dff49f41fa7e0a605eeb59f08374bd4e2075d0f8da6b7b0aba52a76ef
    command: server -D
    volumes:
      - .:/src
      - hugo_cache:/tmp/hugo_cache
    working_dir: /src/site
    ports:
      - 1313:1313
    user: 1000:1000
    depends_on:
      - change-ownership

volumes:
  hugo_cache:
