name: bckr

services:
  change-ownership:
    image: alpine
    command: chown -R 1000:1000 /hugo_cache
    volumes:
      - hugo_cache:/hugo_cache
  hugo:
    image: hugomods/hugo:go-git-0.163.1
    command: server -D
    volumes:
      - .:/src
      - hugo_cache:/tmp/hugo_cache
    working_dir: /src/site
    ports:
      - 1313:1313
    user: 1000:1000
    depends_on:
      - change-ownership

volumes:
  hugo_cache:
